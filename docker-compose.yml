version: '3.8'

services:
  the-eye-oracle:
    build: .
    container_name: the-eye-oracle
    restart: always
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=2048"
    volumes:
      - ./logs:/app/logs
      - ./public/data:/app/public/data
      - ./data:/app/data
    networks:
      - the-eye-network
    healthcheck:
      test: ["CMD", "node", "-e", "try { require('./daemon/eye-oracle-daemon'); console.log('OK'); } catch(e) { process.exit(1); }"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.eye.system=oracle"
      - "com.eye.component=daemon"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # Optional: Backend API (uncomment when ready)
